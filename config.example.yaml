# ---- Web 服务 ----
server:
  host: 127.0.0.1
  port: 8765

# ---- 知识库位置 ----
# raw/（原始素材，只读）与 wiki/（LLM 维护的页面）都在这个目录下
vault:
  path: data/kb

# ---- 大模型 ----
# 填上 api_key 后，wiki 由 LLM 增量编译维护；
# 留空则使用内置的「确定性编译器」兜底，仍会生成完整的页面结构。
llm:
  # 硬开关：设为 false 会强制使用确定性编译器，即使填了 api_key 也不调模型
  enabled: true
  base_url: https://api.openai.com/v1
  api_key: ""
  model: gpt-4o-mini
  temperature: 0.2
  max_tokens: 4096
  max_tool_rounds: 24
  extra_instructions: ""

# ---- 收录 ----
ingest:
  # 收录完成后是否自动接着编译进 wiki（前端据此决定要不要自动跑编译）
  auto_compile: true
  # 单次编译最多让 LLM 读多少字符的原始素材
  max_source_chars: 40000

# ---- 抓取 ----
fetch:
  timeout: 20
  bilibili_cookie: ""      # 填 SESSDATA=xxx 可抓 B 站字幕文稿
  proxy: ""
  enable_ytdlp: true
  ytdlp_timeout: 60        # yt-dlp 单次调用超时（秒）；抓字幕时自动用两倍

# ---- 体检 ----
lint:
  stale_days: 120

search:
  max_results: 40          # 检索默认返回条数
  context_lines: 2
