[project]
name = "atlaswiki"
version = "0.1.0"
description = "Local LLM knowledge compiler with web UI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141,<1",
    "uvicorn>=0.53,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.15,<3",
    "httpx>=0.28,<1",
    "trafilatura>=2.2,<3",
    "lxml>=6.1,<7",
    "pypdf>=6.18,<7",
    "python-frontmatter>=1.3,<2",
    "pyyaml>=6.0.3,<7",
    "python-multipart>=0.0.32,<1",
    "charset-normalizer>=3.5,<4",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.16.7,<1",
]

[project.scripts]
atlaswiki = "atlaswiki.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlaswiki"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
